name: Feature Request
description: Suggest an improvement for Mongoose
title: "[Feature]: "
labels: ["enhancement"]
assignees:
  - dan-snelson
body:
  - type: markdown
    attributes:
      value: |
        **Note:** While all requests are welcome, finding available cycles to build a feature we won't use in our own audits is always challenging.

        Requests that keep Mongoose read-only, evidence-cited, and organization-neutral are the easiest to accept.

        Mongoose uses Jamf Pro as its worked example. A request to support another MDM needs the minimum inputs in [Adding Another MDM](https://github.com/dan-snelson/Mongoose/blob/main/CONTRIBUTING.md#adding-another-mdm); Mongoose never guesses its log paths or formats.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the Mac Admin, script author, or support pain in concrete terms.
      placeholder: |
        Example: Mongoose can't tell which policy launched a script when several policies share one trigger.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe what Mongoose should do instead.
      placeholder: |
        Example: In the script-deployment lens, group script runs by the policy and trigger recorded in the MDM agent log.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: Include workarounds, adjacent tools, or partial solutions you already tried.

  - type: dropdown
    id: scope
    attributes:
      label: Which part of the project would this affect most?
      options:
        - New input or log source
        - Another MDM's agent log or inventory export
        - Script-deployment lens or playbooks
        - Finding classification (interpretation rules)
        - Report format (GBU sections, timeline, delta tables)
        - Preliminary audit (MDM inventory JSON)
        - Re-audit or environment baseline
        - MDM health summary (endpoint roll-up)
        - Sysdiagnose analysis
        - Follow-up Zsh commands
        - Collector script (mongooseCollect.zsh)
        - Sanitization and privacy
        - Agent support (Claude Code, Codex)
        - Documentation / examples
        - Other
    validations:
      required: true

  - type: dropdown
    id: audience
    attributes:
      label: Who benefits most?
      options:
        - Mac Admins
        - Script authors
        - Security and privacy reviewers
        - Support / service desk
        - All of the above
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Anything else
      description: Add sanitized log excerpts, report excerpts, or constraints. Never attach a capture or full report.
